<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Random Picker</title>
  <script src="https://js.arcgis.com/4.28/"></script>
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; background: transparent; }
    button { padding: 15px 30px; font-size: 18px; background-color: #ff6b6b; color: white; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { background-color: #ff5252; }
  </style>
</head>
<body>

  <button id="randomBtn">🎲 Where to Eat?</button>

  <script>
    require(["esri/layers/FeatureLayer"], function(FeatureLayer) {
      // Replace with the REST URL of your published CSV layer
      const layer = new FeatureLayer({
        url: "YOUR_FEATURE_LAYER_REST_URL_HERE"
      });

      document.getElementById("randomBtn").addEventListener("click", function() {
        // Query to get the total count of restaurants
        layer.queryFeatureCount().then(function(count) {
          const randomIndex = Math.floor(Math.random() * count);
          
          // Query again to get that specific random feature
          const query = layer.createQuery();
          query.start = randomIndex;
          query.num = 1; // get exactly 1 record
          query.outFields = ["Name", "Food_Style"]; 
          
          layer.queryFeatures(query).then(function(results) {
            const feature = results.features[0];
            const name = feature.attributes.Name;
            
            // Update the button text or send a message to the user!
            document.getElementById("randomBtn").innerText = `Let's go to: ${name}!`;
            
            // Optional: If you need to communicate this back to the parent Experience Builder,
            // you can use window.parent.postMessage()
          });
        });
      });
    });
  </script>
</body>
</html>
