<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Random Picker</title>
    <style>
        /* Optional: Add some styling to make the button look good in your app */
        #randomBtn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #0079c1;
            color: white;
            border: none;
            border-radius: 4px;
            font-family: Arial, sans-serif;
        }
        #randomBtn:hover {
            background-color: #005a90;
        }
    </style>
    
    <!-- This script tag is required to load the ArcGIS Maps SDK -->
    <script src="https://js.arcgis.com/4.28/"></script>
</head>
<body>

    <button id="randomBtn">🎲 Where to Eat?</button>

    <script>
        // Now that the Esri script is loaded in the <head>, "require" will work
        require(["esri/layers/FeatureLayer"], function(FeatureLayer) {
            
            // 1. PASTE YOUR PUBLISHED LAYER REST URL HERE
            const layer = new FeatureLayer({
                url: "https://services.arcgis.com/KkJhFbLnXVqahKz2/arcgis/rest/services/Late_Night_Locator_Locations/FeatureServer" 
            });

            document.getElementById("randomBtn").addEventListener("click", function() {
                // Change text to show it's "thinking"
                document.getElementById("randomBtn").innerText = "Rolling the dice... 🎲";

                // Query to get the total count of restaurants
                layer.queryFeatureCount().then(function(count) {
                    if (count === 0) {
                        document.getElementById("randomBtn").innerText = "No restaurants found!";
                        return;
                    }

                    const randomIndex = Math.floor(Math.random() * count);
                    
                    // Query again to get that specific random feature
                    const query = layer.createQuery();
                    query.start = randomIndex;
                    query.num = 1; // get exactly 1 record
                    query.outFields = ["Name", "Food_Style"]; // Make sure these match your CSV column names exactly
                    
                    layer.queryFeatures(query).then(function(results) {
                        if (results.features.length > 0) {
                            const feature = results.features[0];
                            const name = feature.attributes.Name;
                            
                            // Update the button text with the winning restaurant!
                            document.getElementById("randomBtn").innerText = `Let's go to: ${name}!`;
                            
                            // Optional: Send data back to Experience Builder
                            // window.parent.postMessage({ action: "zoom", restaurant: name }, "*");
                        }
                    }).catch(function(error){
                        console.error("Error fetching feature: ", error);
                        document.getElementById("randomBtn").innerText = "Error picking a place!";
                    });
                }).catch(function(error){
                    console.error("Error querying count: ", error);
                    document.getElementById("randomBtn").innerText = "Check REST URL!";
                });
            });
        });
    </script>
</body>
</html>
