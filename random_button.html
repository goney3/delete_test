<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Random Picker - Neon Orange</title>
    <style>
        /* Center the button and set a dark background so the neon glow pops */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a; /* Dark background */
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Neon Orange Glowing Button Styling */
        #randomBtn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            color: #ffffff;
            background: transparent;
            border: 2px solid #ff6600;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            
            /* Neon Text Shadow */
            text-shadow: 
                0 0 5px #ff6600, 
                0 0 10px #ff6600;
            
            /* Neon Box Shadow (Outer and Inner glow) */
            box-shadow: 
                0 0 5px #ff6600, 
                0 0 15px #ff6600, 
                inset 0 0 10px #ff6600;
                
            transition: all 0.3s ease;
        }

        /* Intense Glow on Hover */
        #randomBtn:hover {
            background-color: #ff6600;
            color: #ffffff;
            box-shadow: 
                0 0 10px #ff6600, 
                0 0 20px #ff6600, 
                0 0 40px #ff6600, 
                0 0 60px #ff6600;
            text-shadow: none;
        }
        
        /* Slight click effect */
        #randomBtn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <button id="randomBtn">🎲 Where to Eat?</button>

    <script>
        // The list of late-night Santa Barbara spots hardcoded into an array
        const restaurants = [
            "Taqueria Mena",
            "Casa Comal Cocina Tradicional Mexicana",
            "Taqueria Tesoro",
            "Dave's Dogs Grill",
            "JAYDOGZ SB",
            "Gloria's Gourmet Kitchen",
            "Broad Street Oyster Company",
            "Eureka!",
            "The Cruisery",
            "Saint Remy",
            "milk & honey",
            "Roy",
            "Silvers Omakase",
            "SB Biergarten",
            "Dargan's Irish Pub",
            "The Pickle Room",
            "Rodeo Room",
            "Food for my Soul",
            "Rasta Rita Margarita and Beverage Truck",
            "Welcome Coffee Cart"
        ];

        document.getElementById("randomBtn").addEventListener("click", function() {
            const btn = document.getElementById("randomBtn");
            
            // Temporary loading text for suspense
            btn.innerText = "Rolling the dice... 🎲";
            
            // Wait half a second, then pick a random restaurant
            setTimeout(function() {
                const randomIndex = Math.floor(Math.random() * restaurants.length);
                const selectedRestaurant = restaurants[randomIndex];
                
                // Update the button text with the winning restaurant
                btn.innerText = `Let's go to: ${selectedRestaurant}!`;
                
                // (Optional) Send this to Experience Builder if you are listening for widget triggers
                // window.parent.postMessage({ action: "random_pick", restaurant: selectedRestaurant }, "*");
                
            }, 500); 
        });
    </script>
</body>
</html>
